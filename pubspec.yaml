name: personal_discipline
description: "Habit Tracker - Quan ly va theo doi thoi quen hang ngay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Cloud Sync (Supabase Free Tier)
  supabase_flutter: ^2.5.6

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Local Notifications & Timezones
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
